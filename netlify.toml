# Netlify config for the standalone WatchParty site.
# Landing page = / (index.html). The compiled KMP web app = /app/.
# Translated from the original Apache .htaccess that served the app.

[build]
  # Static site — nothing to build, just publish the repo root.
  publish = "."

# ── WASM: serve with the correct MIME so the browser streaming-compiles it
#    instead of failing with "Incorrect response MIME type" ──
[[headers]]
  for = "/app/*.wasm"
  [headers.values]
    Content-Type = "application/wasm"

# ── .wasm files ARE content-hashed (e.g. ec230303974fdfd7aee4.wasm), so the
#    filename changes on every content change → safe to cache forever. ──
[[headers]]
  for = "/app/*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ── .js files are NOT content-hashed by the Kotlin/wasm webpack output — the
#    entry (watchparty.js) and chunks (840.js, 90.js) keep STABLE names across
#    builds. Caching them "immutable" pinned returning visitors to whatever JS
#    they first downloaded (they saw a months-old UI even after redeploys).
#    Revalidate every load instead: cheap 304 when unchanged, fresh when not. ──
[[headers]]
  for = "/app/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── App entry point must always refresh on redeploy ──
[[headers]]
  for = "/app/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

# ── PWA manifest: correct MIME so the browser parses it; revalidate (not
#    content-hashed). ──
[[headers]]
  for = "/app/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "public, max-age=0, must-revalidate"

# ── Service worker: MUST always revalidate so a fixed SW propagates — this is
#    the ONLY self-update / recovery channel for installed clients. Placed after
#    the /app/*.js rule above so this no-store value wins for the SW file. ──
[[headers]]
  for = "/app/firebase-messaging-sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/app/"

# ── PWA icons: stable names, change rarely — a day's cache is fine. ──
[[headers]]
  for = "/app/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# ── app.watchparty.online → launch the WEB APP at the subdomain root ─────────
# app.watchparty.online is a domain alias of THIS Netlify site, so by default it
# mirrors the marketing site. Instead, serve the compiled web app (which lives
# under /app/) at the subdomain's root. The app's HTML uses root-absolute
# /app/... asset paths, so:
#   • requests for /app/* (js, wasm, manifest, icons, SW) pass straight through
#     to the real files — this guard stops the force-rewrite below eating them;
#   • everything else on this host serves the app shell (/app/index.html).
# watchparty.online is a different host, so these rules never affect it.
[[redirects]]
  from = "https://app.watchparty.online/app/*"
  to = "/app/:splat"
  status = 200

[[redirects]]
  from = "https://app.watchparty.online/*"
  to = "/app/index.html"
  status = 200
  force = true

# ── SPA fallback for the Compose client-side router: any deep URL under
#    /app (e.g. /app/room/ABCD) serves the app's index.html so refresh +
#    deep links resolve instead of 404. status 200 = rewrite, not redirect.
#    No force=true, so real static files (manifest, icons, SW) are served
#    directly and are NOT shadowed by this rewrite. ──
[[redirects]]
  from = "/app/*"
  to = "/app/index.html"
  status = 200

# ── Download / launch shortcuts ─────────────────────────────────────────────
# Memorable per-platform URLs that the marketing site, app menus, and shared
# links point at. Path matching is case-sensitive, so each has a lowercase
# alias too (people type both /Android/download and /android/download).
#
#   /download            → the platform-picker hub page (download.html)
#   /Android/download    → the latest Android APK (GitHub Release asset)
#   /Windows + /MacOS    → the in-browser web app (no native desktop build)
#
# Android APK lives as a GitHub Release asset on the PUBLIC, releases-only repo
# `Xemb0/watchparty-app` (the app source stays private). The
# `releases/latest/download/<asset>` URL always resolves to the newest build,
# so the site never needs editing when a new APK ships — just publish a release
# there with the asset named `watchparty.apk`.
[[redirects]]
  from = "/Android/download"
  to = "https://github.com/Xemb0/watchparty-app/releases/latest/download/watchparty.apk"
  status = 302
  force = true

[[redirects]]
  from = "/android/download"
  to = "https://github.com/Xemb0/watchparty-app/releases/latest/download/watchparty.apk"
  status = 302
  force = true

# macOS / Windows have no native build — WatchParty runs in the browser.
[[redirects]]
  from = "/MacOS/download"
  to = "/app/"
  status = 302
  force = true

[[redirects]]
  from = "/macos/download"
  to = "/app/"
  status = 302
  force = true

[[redirects]]
  from = "/Windows/download"
  to = "/app/"
  status = 302
  force = true

[[redirects]]
  from = "/windows/download"
  to = "/app/"
  status = 302
  force = true

# Download hub. Netlify already serves download.html at /download via pretty
# URLs; this makes it explicit and guaranteed.
[[redirects]]
  from = "/download"
  to = "/download.html"
  status = 200
