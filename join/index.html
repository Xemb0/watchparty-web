<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joining WatchParty…</title>
  <!--
    Room-invite landing page (Meet-style fallback).

    When the WatchParty app is INSTALLED, iOS (Universal Links via
    /.well-known/apple-app-site-association) and Android (App Links via
    /.well-known/assetlinks.json) intercept https://watchparty.online/join?roomId=…
    BEFORE the browser — this page never shows.

    When it's NOT installed, the browser lands here and we forward straight
    into the web app, which already joins rooms from ?roomId=.
  -->
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0B0B14; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2); border-top-color: #8B5CF6;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    p  { font-size: 14px; color: rgba(255,255,255,0.65); margin: 0; max-width: 340px; }
    a.btn {
      display: inline-block; margin-top: 10px; padding: 12px 22px;
      background: #8B5CF6; color: #fff; border-radius: 12px;
      text-decoration: none; font-weight: 600; font-size: 15px;
    }
    a.alt { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1>Joining your watch party…</h1>
  <p>If the app doesn't open, continue in the browser — no install needed.</p>
  <a class="btn" id="webLink" href="https://app.watchparty.online/">Continue in browser</a>
  <a class="alt" href="https://watchparty.online/download">Get the app</a>
  <script>
    // Forward the invite into the web app, preserving the roomId (and any
    // other params). Kept on a short delay so an installed app's link
    // interception isn't raced on browsers that still load the page flash.
    var target = "https://app.watchparty.online/" + (window.location.search || "");
    document.getElementById("webLink").href = target;
    setTimeout(function () { window.location.replace(target); }, 400);
  </script>
</body>
</html>
