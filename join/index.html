<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Joining WatchParty…</title>
  <!--
    Room-invite landing page (Meet-style fallback).

    When the WatchParty app is INSTALLED, iOS (Universal Links via
    /.well-known/apple-app-site-association) and Android (App Links via
    /.well-known/assetlinks.json) intercept https://watchparty.online/join?roomId=…
    BEFORE the browser — this page never shows.

    When it's NOT installed, the browser lands here and we route by platform:
      • Android  → Google Play (download the app)
      • iPhone/iPad → App Store (download the app)
      • Desktop (Windows/Linux/macOS) → forward into the web app, which joins
        rooms from ?roomId= — no install needed.
    A "Continue in browser" link stays visible so a mobile user who prefers
    the web app can still join without installing.
  -->
  <style>
    body {
      margin: 0; min-height: 100vh; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 14px;
      background: #0B0B14; color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center; padding: 24px; box-sizing: border-box;
    }
    .spinner {
      width: 34px; height: 34px; border-radius: 50%;
      border: 3px solid rgba(255,255,255,0.2); border-top-color: #8B5CF6;
      animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h1 { font-size: 19px; font-weight: 600; margin: 0; }
    p  { font-size: 14px; color: rgba(255,255,255,0.65); margin: 0; max-width: 340px; }
    a.btn {
      display: inline-block; margin-top: 10px; padding: 12px 22px;
      background: #8B5CF6; color: #fff; border-radius: 12px;
      text-decoration: none; font-weight: 600; font-size: 15px;
    }
    a.alt { color: rgba(255,255,255,0.6); font-size: 13px; text-decoration: underline; }
  </style>
</head>
<body>
  <div class="spinner"></div>
  <h1 id="headline">Joining your watch party…</h1>
  <p id="subline">If the app doesn't open, continue in the browser — no install needed.</p>
  <a class="btn" id="webLink" href="https://app.watchparty.online/">Continue in browser</a>
  <a class="alt" id="storeLink" href="https://watchparty.online/download">Get the app</a>
  <script>
    (function () {
      var ua = navigator.userAgent || '';
      var params = window.location.search || '';
      // Same UA sniff as download.html: an iPad in desktop mode reports
      // MacIntel + touch points, so check touch before the Mac branch.
      var plat = 'desktop';
      if (/android/i.test(ua)) plat = 'android';
      else if (/iphone|ipad|ipod/i.test(ua) ||
               (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1)) plat = 'ios';

      var APPSTORE = 'https://apps.apple.com/app/id6761379322';
      var PLAY = 'https://play.google.com/store/apps/details?id=com.autotech.watchparty';
      var WEB = 'https://app.watchparty.online/' + params; // keeps ?roomId=…
      var STORE_PAGE = 'https://watchparty.online/download';

      var webLink = document.getElementById('webLink');
      var storeLink = document.getElementById('storeLink');
      webLink.href = WEB;

      // A browser landing does not prove the app is absent: link verification may fail.
      if (plat === 'android' || plat === 'ios') {
        var store = plat === 'android' ? PLAY : APPSTORE;
        document.title = 'Get WatchParty for ' + (plat === 'android' ? 'Android' : 'iOS');
        document.getElementById('headline').textContent = 'Open WatchParty on your phone';
        document.getElementById('subline').textContent =
          'Open the app to join this room, or continue in your browser.';
        storeLink.href = store;
        storeLink.textContent = 'Continue to ' + (plat === 'android' ? 'Google Play' : 'App Store');
        // Keep the web fallback reachable so mobile users can still join
        // without installing (guest mode) — no auto-redirect, they choose.
        webLink.textContent = 'Continue in browser instead';
        webLink.classList.add('alt');
        // Android explicit intent retains the room even before domain verification refreshes.
        if (plat === 'android') {
          var room = new URLSearchParams(params).get('roomId');
          if (room && /^[a-z0-9]{4,12}$/i.test(room)) {
            var openApp = document.createElement('a');
            openApp.className = 'btn';
            openApp.textContent = 'Open WatchParty';
            openApp.href = 'intent://watchparty.online/join?roomId=' + encodeURIComponent(room) +
              '#Intent;scheme=https;package=com.autotech.watchparty;S.browser_fallback_url=' + encodeURIComponent(WEB) + ';end';
            webLink.parentNode.insertBefore(openApp, webLink);
          }
        }
      } else {
        // Desktop (Windows/Linux/macOS): the web app IS the product. Forward
        // into it, preserving the roomId (and any other params). Kept on a
        // short delay so an installed app's link interception isn't raced on
        // browsers that still load the page flash.
        storeLink.href = STORE_PAGE;
        setTimeout(function () { window.location.replace(WEB); }, 400);
      }
    })();
  </script>
</body>
</html>
